name: Backend Tests

on: workflow_call

jobs:
  Unit-Tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: 3.15

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend"

      - name: Install Pip
        run: |
          python -m pip install --upgrade pip
          pip --version

      - name: Create environment
        run: python -m venv traitorsontv

      - name: Run environment
        run: source traitorsontv/bin/activate

      # - name: Remove dependencies from requirements
      #   run: make remove-dependancies-for-tests

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Unit Tests
        run: pytest
