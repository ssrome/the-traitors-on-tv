name: PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches-ignore:
      - "dependabot/**"

jobs:
  Call-Deploy-To-Vercel-Workflow:
    uses: ./.github/workflows/deploy-to-vercel.yaml
    secrets:
      VercelToken: ${{ secrets.VERCEL_TOKEN }}
  Call-Deploy-to-AWS-Workflow:
    uses: ./.github/workflows/deploy-to-aws.yaml
