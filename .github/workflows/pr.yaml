name: PR

on:
  pull_request:
    types: [opened, edited, reopened]
    branches-ignore:
      - "dependabot/**"

jobs:
  call-backend-Tests:
    uses: ./.github/workflows/backend-tests.yaml

  call-deploy-backend:
    uses: ./.github/workflows/deploy-to-aws.yaml

  call-frontend-tests:
    uses: ./.github/workflows/frontend-tests.yaml

  call-deploy-frontend:
    uses: ./.github/workflows/deploy-to-vercel.yaml
