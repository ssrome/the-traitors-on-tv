name: Dependabot Check

on:
  push:
    branches:
      - "dependabot/**"

jobs:
  Call-Backend-Tests-Workflow:
    uses: ./.github/workflows/backend-tests.yaml
  Call-Frontend-Tests-Workflow:
    uses: ./.github/workflows/frontend-tests.yaml

  Check-Dependabot:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    needs: Call-Frontend-Tests-Workflow
    steps:
      - run: echo "PR created by Dependabot"
      - run: echo "DEPLOY_TO_VERCEL=false" >> $GITHUB_ENV
