name: Dependabot Check

on:
  workflow_run:
    workflows: ["Frontend Tests", "Backend Tests"]
    types: [completed]
    branches:
      - "dependabot/**"

jobs:
  Check-Dependabot:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - run: echo "PR created by Dependabot"
      - run: echo "DEPLOY_TO_VERCEL=false" >> $GITHUB_ENV
