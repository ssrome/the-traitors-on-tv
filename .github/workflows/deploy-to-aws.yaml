name: Deploy

on:
  push:
    # paths:
    #     - "backend/**"
    branches-ignore:
      - "dependabot/**"

jobs:
  Call-Backend-Tests-Workflow:
    uses: ./.github/workflows/backend-tests.yaml

  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: backend
    needs: Call-Backend-Tests-Workflow
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Setup AWS CLI
        run: |
          python -m pip install --upgrade pip
          pip install awscli

