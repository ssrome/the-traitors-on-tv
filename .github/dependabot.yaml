version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend/"
    schedule:
      interval: daily
      time: "01:00"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/backend/"
    schedule:
      interval: daily
      time: "01:00"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
      time: "01:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
