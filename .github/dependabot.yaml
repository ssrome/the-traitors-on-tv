version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend/"
    schedule:
      interval: daily
      time: "04:00"
    groups:
      angular:
        applies-to: version-updates
        patterns:
          - "@angular*"
        update-types:
          - "minor"
          - "patch"
      minor-and-patch:
        applies-to: security-updates
        patterns:
          - "@angular*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/backend/"
    schedule:
      interval: daily
      time: "04:00"
    groups:
      version-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "algoliasearch"
          - "boto3"
          - "botocore"
          - "python-dateutil"
          - "s3transfer"
        update-types:
          - "minor"
          - "patch"
      security-minor-and-patch:
        applies-to: security-updates
        patterns:
          - "algoliasearch"
          - "boto3"
          - "botocore"
          - "python-dateutil"
          - "s3transfer"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
      time: "04:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
