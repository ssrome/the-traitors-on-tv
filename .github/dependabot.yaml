version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend/"
    schedule:
      interval: daily
      time: "04:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 4
  - package-ecosystem: "pip"
    directory: "/backend/"
    schedule:
      interval: daily
      time: "04:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 4
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
      time: "04:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 4
