AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AWS serverless project for The Traitors TV information

Conditions:
  isSamLocal:
    Fn::Equals: [Ref: "AWS::StackName", ""]
  isMain:
    Fn::Equals: [Ref: "AWS::StackName", "thetraitorsontv"]

Parameters:
  AlgoliaApplicationID:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/thetraitorsontv/AlgoliaApplicationID"

  AlgoliaObjectAPIKeyDev:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/thetraitorsontv/AlgoliaObjectAPIKeyDev"

  AlgoliaObjectAPIKeyProd:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/thetraitorsontv/AlgoliaObjectAPIKeyProd"

  AlgoliaIndexDev:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/thetraitorsontv/AlgoliaIndexDev"

  AlgoliaIndexProd:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/thetraitorsontv/AlgoliaIndexProd"

  TmdbApi:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/thetraitorsontv/TmdbApi"

  TmdbApiKey:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/thetraitorsontv/TmdbApiKey"

Globals:
  Function:
    Timeout: 180
    MemorySize: 256
    Runtime: python3.13

    Environment:
      Variables:
        BUILD_ENV: "production"

Resources:
  # Functions
  CallTMDBApi:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./dist
      Handler: "callTMDBApi.handler"
      Environment:
        Variables:
          ALGOLIA_APPLICATION_ID:
            Ref: AlgoliaApplicationID
          ALGOLIA_API_KEY:
            Fn::If:
              [
                isMain,
                Ref: AlgoliaObjectAPIKeyProd,
                Ref: AlgoliaObjectAPIKeyDev,
              ]
          ALGOLIA_INDEX:
            Fn::If: [isMain, Ref: AlgoliaIndexProd, Ref: AlgoliaIndexDev]
          TMDB_API:
            Ref: TmdbApi
      Events:
        TriggerCallTMDBApi:
          Type: Schedule
          Properties:
            Enabled: True
            Schedule:
              Fn::If: [isMain, "cron(1 0 * * ? *)", "cron(1 0 ? * 2 *)"]
      Policies:
        - AmazonDynamoDBReadOnlyAccess

  #Log groups
  CallTMDBApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30
      LogGroupName:
        Fn::Join:
          - ""
          - - "/aws/lambda/"
            - Ref: CallTMDBApi
