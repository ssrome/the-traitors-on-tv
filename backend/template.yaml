AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AWS serverless project for The Traitors TV information

Conditions:
  isSamLocal:
    Fn::Equals: [Ref: "AWS::StackName", ""]
  isMain:
    Fn::Equals: [Ref: "AWS::StackName", "the-traitors-on-tv"]

Parameters:
  AlgoliaApplicationID:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/thetraitorsontv/AlgoliaApplicationID"

  AlgoliaObjectAPIKeyDev:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/thetraitorsontv/AlgoliaObjectAPIKeyDev"

  AlgoliaObjectAPIKeyProd:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/thetraitorsontv/AlgoliaObjectAPIKeyProd"

  AlgoliaIndexDev:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/thetraitorsontv/AlgoliaIndexDev"

  AlgoliaIndexProd:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/thetraitorsontv/AlgoliaIndexProd"

  TmdbApi:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/thetraitorsontv/TmdbApi"

  TmdbApiKey:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/thetraitorsontv/TmdbApiKey"

  NotionUrl:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/thetraitorsontv/NotionUrl"

  NotionSecretKey:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/thetraitorsontv/NotionSecretKey"

  NotionDatabaseId:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: "/thetraitorsontv/NotionDatabaseId"

Globals:
  Function:
    Timeout: 600
    MemorySize: 256
    Runtime: python3.13
    Handler: handler.handler
    Architectures:
      - x86_64
    Environment:
      Variables:
        BUILD_ENV: "production"

Resources:
  # Bucket
  TheTraitorsOnTVBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: "Delete"
    Properties:
      BucketName:
        Ref: AWS::StackName

  # SNS Topic
  ShowIDsSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName:
        Ref: AWS::StackName
      TopicName:
        Ref: AWS::StackName
      Subscription:
        - Protocol: lambda
          Endpoint: !GetAtt
            - CallTmdbApi
            - Arn

  # Functions
  CallTmdbApi:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/handlers/call_tmdb_api
      Layers:
        - !Ref PythonProjectLayer
      Environment:
        Variables:
          ALGOLIA_APPLICATION_ID:
            Ref: AlgoliaApplicationID
          ALGOLIA_API_KEY:
            Fn::If:
              [
                isMain,
                Ref: AlgoliaObjectAPIKeyProd,
                Ref: AlgoliaObjectAPIKeyDev,
              ]
          ALGOLIA_INDEX:
            Fn::If: [isMain, Ref: AlgoliaIndexProd, Ref: AlgoliaIndexDev]
          TMDB_API:
            Ref: TmdbApi
          TMDB_API_KEY:
            Ref: TmdbApiKey
      Events:
        SnsTriggerEvent:
          Type: SNS
          Properties:
            Topic:
              Ref: ShowIDsSNSTopic
      Policies:
        - AWSLambdaBasicExecutionRole

  GetIds:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/handlers/get_ids
      Layers:
        - !Ref PythonProjectLayer
      Environment:
        Variables:
          SNS_TOPIC:
            Ref: ShowIDsSNSTopic
          S3_BUCKET:
            Ref: TheTraitorsOnTVBucket
      Events:
        S3Event:
          Type: S3
          Properties:
            Bucket:
              Ref: TheTraitorsOnTVBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value:
                      Fn::If: [isMain, "prod.csv", "dev.csv"]
      Policies:
        - AWSLambdaBasicExecutionRole
        - AmazonS3ObjectLambdaExecutionRolePolicy
        - AmazonS3ReadOnlyAccess
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - "sns:Publish"
              Resource:
                Ref: ShowIDsSNSTopic

  GetIdsFromNotion:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/handlers/get_ids_from_notion
      Layers:
        - !Ref PythonProjectLayer
      Environment:
        Variables:
          SNS_TOPIC:
            Ref: ShowIDsSNSTopic
          NOTION_URL:
            Ref: NotionUrl
          NOTION_SECRET_KEY:
            Ref: NotionSecretKey
          NOTION_DATABASE_ID:
            Ref: NotionDatabaseId
          ENVIRONMENT_FILTER:
            Fn::If: [isMain, "Prod", "Dev"]
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Enabled: True
            Schedule:
              Fn::If: [isMain, "cron(1 5 ? * * *)", "cron(1 0 ? * 2 *)"]
      Policies:
        - AWSLambdaBasicExecutionRole
        - AmazonS3ObjectLambdaExecutionRolePolicy
        - AmazonS3ReadOnlyAccess
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - "sns:Publish"
              Resource:
                Ref: ShowIDsSNSTopic

  # Lambda Permission
  InvokeCallTmdbApiRole:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: GetIds
      Principal: sns.amazonaws.com

  # Log groups
  CallTmdbApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30
      LogGroupName:
        Fn::Join:
          - ""
          - - "/aws/lambda/"
            - Ref: CallTmdbApi

  GetIdsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30
      LogGroupName:
        Fn::Join:
          - ""
          - - "/aws/lambda/"
            - Ref: GetIds

  GetIdsFromNotionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30
      LogGroupName:
        Fn::Join:
          - ""
          - - "/aws/lambda/"
            - Ref: GetIdsFromNotion

  #Layers
  PythonProjectLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: src/layers/python_scripts/python_layer_content.zip
      CompatibleRuntimes:
        - python3.13
      CompatibleArchitectures:
        - x86_64

  CallTmdbApiLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: src/layers/call_tmdb_api/python_layer_content.zip
      CompatibleRuntimes:
        - python3.13
      CompatibleArchitectures:
        - x86_64

  ShowIDsSNSTopicPolicy:
    Type: "AWS::SNS::TopicPolicy"
    Properties:
      Topics:
        - Ref: ShowIDsSNSTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "sns:Publish"
            Resource:
              Ref: ShowIDsSNSTopic
            Principal:
              AWS: "*"
            Condition:
              ArnLike:
                AWS:SourceArn: !Sub "arn:aws:*:*:${AWS::AccountId}:*"
