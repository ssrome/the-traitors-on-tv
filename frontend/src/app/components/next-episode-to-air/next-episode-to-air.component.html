<div>
  <h2>Next Episode To Air</h2>

  <div class="cards" *ngFor="let show of showsNextToAir">
    <mat-card class="card" appearance="outlined">
      <mat-card-header>
        <!-- <div mat-card-avatar class="header-image"></div> -->
        <div class="card-image-container">
          <img
            class="card-image"
            src="https://image.tmdb.org/t/p/w440_and_h660_face/{{
              show?.poster_path
            }}"
          />
        </div>
        <mat-card-title-group>
          <mat-card-title
            >{{ show?.original_name }} ({{
              show?.origin_country[0]
            }})</mat-card-title
          >
          <mat-card-subtitle
            >{{ $safeNavigationMigration(show?.next_episode_to_air?.air_date) | date }} <br />S{{
              show?.next_episode_to_air?.season_number
            }}
            Ep.{{ show?.next_episode_to_air?.episode_number }}
          </mat-card-subtitle>
        </mat-card-title-group>
      </mat-card-header>
    </mat-card>
  </div>
</div>
